[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statline"
version = "1.0.0"
description = "statline —— 零依赖的统计摘要命令行工具:min/max/均值/中位数/标准差/百分位 + 文本直方图(渲染复用 cjktable)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # 自研终端排版微库(CJK 对齐),与项目集共同维护
    "cjktable @ git+https://github.com/JAKE1266/cjktable.git",
]
license = { text = "MIT" }
authors = [{ name = "JAKE1266" }]
keywords = ["statistics", "summary", "percentile", "histogram", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/JAKE1266/statline"
Issues = "https://github.com/JAKE1266/statline/issues"

[project.scripts]
statline = "statline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
